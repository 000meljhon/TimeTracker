<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Executive Time Tracker | BBSI</title>
    <!-- Tailwind CSS for modern SaaS layout -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS for Excel Export -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="p-6 md:p-10">

    <div class="max-w-6xl mx-auto space-y-8">
        
        <!-- Header -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 border-b border-slate-700 pb-6">
            <div>
                <h1 class="text-3xl font-bold tracking-tight text-white">Employee Time Tracker</h1>
                <p class="text-slate-400 text-sm mt-1">Work hour computation.</p>
            </div>
            <button onclick="exportToExcel()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-medium px-5 py-2.5 rounded-xl shadow-lg transition-all flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                </svg>
                Export to Excel (.xlsx)     
            </button>
        </div>

        <!-- Boss Control Panels -->
        <div class="glass-card rounded-2xl p-6 shadow-xl">
            <h2 class="text-lg font-semibold text-white mb-4">Manager Action Console</h2>
            <form id="timeForm" onsubmit="handleTimeAction(event)" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs uppercase tracking-wider text-slate-400 mb-2 font-semibold">Employee Name</label>
                    <input type="text" id="employeeName" required placeholder="e.g., Mel Jhon" class="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs uppercase tracking-wider text-slate-400 mb-2 font-semibold">Action Type</label>
                    <select id="actionType" class="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-indigo-500">
                        <option value="IN">Time In</option>
                        <option value="OUT">Time Out</option>
                    </select>
                </div>
                <div class="flex items-end">
                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 rounded-xl shadow-lg transition-all">
                        Execute Action
                    </button>
                </div>
            </form>
        </div>

        <!-- Active Shifts & Log History -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- Live Active Shifts with Search -->
            <div class="glass-card rounded-2xl p-6 shadow-xl lg:col-span-1 flex flex-col justify-between space-y-4">
                <div class="space-y-4">
                    <div class="border-b border-slate-700 pb-3 space-y-3">
                        <h3 class="text-md font-semibold text-white">Currently Clocked In</h3>
                        <input type="text" id="searchActiveInput" oninput="renderActiveShifts()" placeholder="Search active employee..." class="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-3 py-1.5 text-xs text-white focus:outline-none focus:border-indigo-500">
                    </div>
                    <div id="activeShiftsList" class="space-y-3">
                        <p class="text-slate-500 text-sm italic">No active employees.</p>
                    </div>
                </div>
            </div>

            <!-- Log Table with Search Bar -->
            <div class="glass-card rounded-2xl p-6 shadow-xl lg:col-span-2 overflow-hidden flex flex-col justify-between">
                <div>
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b border-slate-700 pb-3 mb-4 gap-3">
                        <h3 class="text-md font-semibold text-white">Attendance Logs & Computations</h3>
                        <input type="text" id="searchInput" oninput="renderLogsTable()" placeholder="Search history..." class="w-full sm:w-60 bg-slate-900/50 border border-slate-700 rounded-xl px-3 py-1.5 text-xs text-white focus:outline-none focus:border-indigo-500">
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="text-xs uppercase text-slate-400 border-b border-slate-700">
                                    <th class="pb-3 px-2">Employee</th>
                                    <th class="pb-3 px-2">Time In</th>
                                    <th class="pb-3 px-2">Time Out</th>
                                    <th class="pb-3 px-2 text-right">Total Hours</th>
                                    <th class="pb-3 px-2 text-center">Action</th>
                                </tr>
                            </thead>
                            <tbody id="logsTableBody" class="text-sm divide-y divide-slate-800">
                                <tr>
                                    <td colspan="5" class="py-4 text-center text-slate-500 italic">No historical logs available.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>

    </div>

    <!-- Link to Separate JS File -->
    <script src="script.js"></script>
</body>
</html>
